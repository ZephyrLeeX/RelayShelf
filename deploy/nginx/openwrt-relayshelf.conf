# OpenWrt nginx reference. Replace every <placeholder> before installation.
# The OpenWrt address must be the only address included in TRUSTED_PROXIES.
server {
    listen 80;
    listen [::]:80;
    server_name <public-domain>;
    return 301 https://<public-domain>$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <public-domain>;

    ssl_certificate     <certificate-path>;
    ssl_certificate_key <private-key-path>;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;

    # Discard client-supplied forwarding claims at the trust boundary.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE: keep the stream unbuffered and allow long-lived connections.
    location = /api/v1/events {
        proxy_pass http://<debian-vm-ip>:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # 8 MiB chunk requests stream directly to RelayShelf.
    location ~ ^/api/v1/uploads/[^/]+/parts/[0-9]+$ {
        proxy_pass http://<debian-vm-ip>:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # Go remains authoritative for Range, ETag and Content-Disposition.
    location ~ ^/api/v1/attachments/[^/]+/(download|preview|thumbnail)$ {
        proxy_pass http://<debian-vm-ip>:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }

    # All authenticated/private API responses bypass proxy caches.
    location /api/ {
        proxy_pass http://<debian-vm-ip>:8080;
        proxy_cache off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://<debian-vm-ip>:8080;
        proxy_cache off;
    }
}
