name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          IMAGE="ghcr.io/zephyrleex/relayshelf:${VERSION}"
          BUNDLE="relayshelf-deploy-${VERSION}.tar.gz"
          CHECKSUM="${BUNDLE}.sha256"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build authoritative release
        run: |
          ./deploy/scripts/build-release.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.image }}" \
            "${{ steps.version.outputs.bundle }}"

      - name: Verify production image
        run: |
          CONTAINER_RUNTIME=podman \
            ./deploy/scripts/verify-image.sh \
            "${{ steps.version.outputs.image }}"

      - name: Generate deployment bundle checksum
        run: sha256sum "${{ steps.version.outputs.bundle }}" > "${{ steps.version.outputs.checksum }}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push production image
        run: |
          podman push "${{ steps.version.outputs.image }}"

      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          bundle="${{ steps.version.outputs.bundle }}"
          checksum="${{ steps.version.outputs.checksum }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=true
            gh release upload "$tag" "$bundle" "$checksum" --clobber
          else
            gh release create "$tag" "$bundle" "$checksum" \
              --draft --verify-tag --title "RelayShelf ${{ steps.version.outputs.version }}" --generate-notes
          fi

          asset_names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          grep -Fxq "$bundle" <<<"$asset_names"
          grep -Fxq "$checksum" <<<"$asset_names"
          gh release edit "$tag" --draft=false
