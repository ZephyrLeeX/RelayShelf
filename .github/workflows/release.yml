name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          IMAGE="ghcr.io/zephyrleex/relayshelf:${VERSION}"
          BUNDLE="relayshelf-deploy-${VERSION}.tar.gz"
          CHECKSUM="${BUNDLE}.sha256"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Check release immutability
        id: release_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          release_state=$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY_OWNER}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F tag="$tag" \
            -f query='query($owner: String!, $name: String!, $tag: String!) {
              repository(owner: $owner, name: $name) {
                release(tagName: $tag) { tagName isDraft }
              }
            }' \
            --jq 'if .data.repository.release == null then "missing" else [.data.repository.release.tagName, (.data.repository.release.isDraft | tostring)] | @tsv end')

          case "$release_state" in
            missing)
              echo "release_state=missing" >> "$GITHUB_OUTPUT"
              ;;
            "$tag"$'\ttrue')
              echo "release_state=draft" >> "$GITHUB_OUTPUT"
              ;;
            "$tag"$'\tfalse')
              echo "Release $tag is already published and immutable" >&2
              exit 1
              ;;
            *)
              echo "Unexpected release state for $tag: $release_state" >&2
              exit 1
              ;;
          esac

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build authoritative release
        run: |
          ./deploy/scripts/build-release.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.image }}" \
            "${{ steps.version.outputs.bundle }}"

      - name: Verify production image
        run: |
          CONTAINER_RUNTIME=podman \
            ./deploy/scripts/verify-image.sh \
            "${{ steps.version.outputs.image }}"

      - name: Generate deployment bundle checksum
        run: sha256sum "${{ steps.version.outputs.bundle }}" > "${{ steps.version.outputs.checksum }}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push production image
        run: |
          podman push "${{ steps.version.outputs.image }}"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          bundle="${{ steps.version.outputs.bundle }}"
          checksum="${{ steps.version.outputs.checksum }}"

          release_state="${{ steps.release_guard.outputs.release_state }}"
          if [ "$release_state" = draft ]; then
            existing_tag=$(gh release view "$tag" --json tagName --jq '.tagName')
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            [ "$existing_tag" = "$tag" ] || {
              echo "Draft Release tag mismatch: expected $tag, got $existing_tag" >&2
              exit 1
            }
            [ "$is_draft" = true ] || {
              echo "Release $tag is already published and immutable" >&2
              exit 1
            }
            gh release upload "$tag" "$bundle" "$checksum" --clobber
          elif [ "$release_state" = missing ]; then
            gh release create "$tag" "$bundle" "$checksum" \
              --draft --verify-tag --title "RelayShelf ${{ steps.version.outputs.version }}" --generate-notes
          else
            echo "Refusing unexpected guarded release state: $release_state" >&2
            exit 1
          fi

          asset_names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          grep -Fxq "$bundle" <<<"$asset_names"
          grep -Fxq "$checksum" <<<"$asset_names"
          gh release edit "$tag" --draft=false
