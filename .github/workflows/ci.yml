name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise install
      - run: pnpm --dir web install --frozen-lockfile
      - run: go mod download
      - run: make generate
      - run: git diff --exit-code

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relayshelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d relayshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise install
      - run: go mod download
      - run: test -z "$(gofmt -l $(find cmd internal sql/generated -name '*.go' -type f))"
      - run: go vet ./...
      - run: golangci-lint run
      - run: go test ./...
      - run: ./scripts/review-harness-tests.sh
      - run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable go test -tags=integration ./internal/search/... ./internal/platform/database/...
      - run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable go test -race -tags=integration ./internal/...
      - name: Run application secret logging integration test
        run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable go test -tags=integration -run TestApplicationLogsNeverContainSecrets -count=1 -v ./cmd/...
      - name: Run crash-window process integration tests
        run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable RELAYSHELF_TEST_DESTRUCTIVE=1 go test -tags=integration -run TestCrashWindow -count=1 -v ./cmd/...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise install
      - run: pnpm --dir web install --frozen-lockfile
      - run: cd web && pnpm typecheck && pnpm lint && pnpm test --run && pnpm build

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relayshelf_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d relayshelf_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise install
      - run: pnpm --dir web install --frozen-lockfile
      - run: go mod download
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Build web and server from source
        run: make build
      - name: Run browser journeys
        run: make e2e
        env:
          E2E_DATABASE_URL: postgres://test:test@localhost:5432/relayshelf_e2e?sslmode=disable

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Derive release metadata
        id: meta
        run: |
          printf 'version=0.0.0-ci\n' >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docker.io/example/relayshelf:0.0.0-ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
      - name: Verify injected build metadata
        run: |
          docker run --rm --entrypoint /relayshelf docker.io/example/relayshelf:0.0.0-ci version 2>&1 | tee version.log
          grep -q "RelayShelf 0.0.0-ci" version.log
          grep -q "(commit $GITHUB_SHA, " version.log
          ! grep -qi unknown version.log
      - name: Verify production image contents and non-root runtime
        run: CONTAINER_RUNTIME=docker ./deploy/scripts/verify-image.sh docker.io/example/relayshelf:0.0.0-ci

  deployment:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    env:
      DEPLOYMENT_PODMAN_VERSION: 5.4.2+ds1-2+b2
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Debian 13 Quadlet generator
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make "podman=${DEPLOYMENT_PODMAN_VERSION}"
      - name: Verify Quadlet, scripts, NFS gate, nginx, and release policy
        run: make deploy-verify
