name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: pnpm --dir web install --frozen-lockfile
      - run: go mod download
      - run: make generate
      - run: git diff --exit-code

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relayshelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d relayshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: go mod download
      - run: test -z "$(gofmt -l $(find cmd internal sql/generated -name '*.go' -type f))"
      - run: go vet ./...
      - run: golangci-lint run
      - run: go test ./...
      - run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable go test -tags=integration ./internal/search/... ./internal/platform/database/...
      - run: DATABASE_URL=postgres://test:test@localhost:5432/relayshelf_test?sslmode=disable go test -race -tags=integration ./internal/...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: pnpm --dir web install --frozen-lockfile
      - run: cd web && pnpm typecheck && pnpm lint && pnpm test --run && pnpm build

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Derive release metadata
        id: meta
        run: |
          printf 'version=ci-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: relayshelf:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
      - name: Verify injected build metadata
        run: |
          docker run --rm --entrypoint /relayshelf relayshelf:ci version 2>&1 | tee version.log
          grep -q "RelayShelf ci-" version.log
          grep -q "(commit $GITHUB_SHA, " version.log
          ! grep -qi unknown version.log
