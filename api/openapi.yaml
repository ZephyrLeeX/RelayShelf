openapi: 3.1.1
info:
  title: RelayShelf API
  version: 0.0.0
  description: HTTP contract authority for RelayShelf.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Check service health.
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
