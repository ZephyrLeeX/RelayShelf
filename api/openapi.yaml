openapi: 3.1.1
info:
  title: RelayShelf API
  version: 0.11.0
  description: HTTP contract authority for RelayShelf.
servers:
  - url: /api/v1
paths:
  /events:
    get:
      operationId: getEvents
      description: Stream metadata-only RealtimeEvent SSE frames. Last-Event-ID is ignored; clients refetch truth after reconnect.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Realtime event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session bootstrap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthBootstrap' }
        '202':
          description: Password accepted but a TOTP second factor is required; no session cookie is issued until the challenge completes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPLoginChallenge' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login/totp:
    post:
      operationId: completeLoginTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPChallengeRequest' }
      responses:
        '200':
          description: Second factor accepted; authenticated session bootstrap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthBootstrap' }
        '401': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/totp:
    get:
      operationId: getTOTPStatus
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current user TOTP enrollment state without any secret material
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPStatus' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/totp/enroll:
    post:
      operationId: startTOTPEnrollment
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPEnrollmentRequest' }
      responses:
        '201':
          description: Pending enrollment material; TOTP stays disabled until the confirmation code validates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPEnrollmentPending' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/totp/confirm:
    post:
      operationId: confirmTOTPEnrollment
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPCodeRequest' }
      responses:
        '200':
          description: TOTP enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/totp/disable:
    post:
      operationId: disableTOTP
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPCodeRequest' }
      responses:
        '200':
          description: TOTP disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      operationId: getAuthSession
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current session bootstrap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthBootstrap' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      operationId: changePassword
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: Password changed and other sessions revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sessions:
    get:
      operationId: listSessions
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current user's sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
        '401': { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}:
    delete:
      operationId: revokeSession
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /devices:
    get:
      operationId: listDevices
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current user's devices
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/Error' }
  /devices/{deviceId}:
    patch:
      operationId: renameDevice
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameDeviceRequest' }
      responses:
        '200':
          description: Renamed device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /uploads:
    post:
      operationId: createUpload
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201': { description: Created upload session, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}:
    get:
      operationId: getUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UploadId' }]
      responses:
        '200': { description: Current upload status, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}/parts/{partNumber}:
    put:
      operationId: putUploadPart
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UploadId' }
        - { $ref: '#/components/parameters/PartNumber' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Part durably stored }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UploadId' }]
      responses:
        '200': { description: Upload finalized or already completed, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '507': { $ref: '#/components/responses/Error' }
  /messages:
    post:
      operationId: createMessage
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMessageRequest' } } } }
      responses:
        '201': { description: Created message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listMessages
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: lifecycle, in: query, schema: { $ref: '#/components/schemas/Lifecycle' } }
        - { name: favorite, in: query, schema: { type: boolean } }
        - { name: tagId, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Active messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessageList' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /search:
    get:
      operationId: searchMessages
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: lifecycle, in: query, schema: { $ref: '#/components/schemas/Lifecycle' } }
        - { name: favorite, in: query, schema: { type: boolean } }
        - { name: tagId, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: type, in: query, schema: { type: string, maxLength: 64 } }
        - { name: createdAfter, in: query, schema: { type: string, format: date-time } }
        - { name: createdBefore, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Current user's matching active messages, newest first
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /messages/direct-send:
    post:
      operationId: directSendMessage
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectSendRequest' } } } }
      responses:
        '201': { description: Immutable delivery receipt, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDeliveryReceipt' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /messages/{messageId}:
    parameters: [{ $ref: '#/components/parameters/MessageId' }]
    get:
      operationId: getMessage
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Message detail, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: editMessage
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EditMessageRequest' } } } }
      responses:
        '200': { description: Updated message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /messages/{messageId}/tags:
    put:
      operationId: replaceMessageTags
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceMessageTagsRequest' } } } }
      responses:
        '200': { description: Updated message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /messages/{messageId}/attachments:
    post:
      operationId: addMessageAttachments
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddAttachmentsRequest' } } } }
      responses: { '200': { description: Updated message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/attachments/{attachmentId}:
    delete:
      operationId: removeMessageAttachment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }, { $ref: '#/components/parameters/AttachmentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Updated message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /attachments/{attachmentId}/download:
    get:
      operationId: downloadAttachment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        '200': { description: Full attachment, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '206': { description: Attachment byte range, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /attachments/{attachmentId}/preview:
    get:
      operationId: previewAttachment
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        '200': { description: Full allowlisted inline attachment, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '206': { description: Allowlisted inline attachment byte range, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /attachments/{attachmentId}/thumbnail:
    get:
      operationId: getAttachmentThumbnail
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        '200':
          description: Server-generated safe raster thumbnail
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /messages/{messageId}/make-permanent:
    post:
      operationId: makeMessagePermanent
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Permanent message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/extend:
    post:
      operationId: extendMessageExpiry
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtendMessageExpiryRequest' } } } }
      responses: { '200': { description: Temporary message with extended expiry, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/favorite:
    post:
      operationId: setMessageFavorite
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FavoriteRequest' } } } }
      responses: { '200': { description: Updated message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/trash:
    post:
      operationId: trashMessage
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Trashed message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/sensitive:
    post:
      operationId: setMessageSensitive
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SensitiveRequest' } } } }
      responses: { '200': { description: Updated message metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/sensitive-body:
    parameters: [{ $ref: '#/components/parameters/MessageId' }]
    get:
      operationId: revealSensitiveBody
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Sensitive plaintext, headers: { Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SensitiveBody' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
    put:
      operationId: editSensitiveBody
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EditSensitiveBodyRequest' } } } }
      responses: { '200': { description: Updated safe metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /messages/{messageId}/forward:
    post:
      operationId: forwardMessage
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MessageId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForwardRequest' } } } }
      responses: { '201': { description: Immutable delivery receipt, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDeliveryReceipt' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /trash:
    get:
      operationId: listTrash
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Trashed messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessageList' } } } }, '422': { $ref: '#/components/responses/Error' } }
  /trash/{messageId}/restore:
    post:
      operationId: restoreMessage
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Restored message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /trash/{messageId}:
    delete:
      operationId: permanentlyDeleteMessage
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      responses: { '204': { description: Permanently deleted }, '404': { $ref: '#/components/responses/Error' } }
  /tags:
    get:
      operationId: listTags
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: User tags, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tag' } } } } } }
    post:
      operationId: createTag
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagRequest' } } } }
      responses: { '201': { description: Created tag, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /tags/{tagId}:
    parameters: [{ $ref: '#/components/parameters/TagId' }]
    patch:
      operationId: updateTag
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTagRequest' } } } }
      responses: { '200': { description: Updated tag, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteTag
      security: [{ cookieAuth: [] }]
      responses: { '204': { description: Deleted tag }, '404': { $ref: '#/components/responses/Error' } }
  /admin/settings:
    get:
      operationId: getRuntimeSettings
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Typed singleton runtime settings, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeSettings' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateRuntimeSettings
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRuntimeSettingsRequest' } } } }
      responses:
        '200': { description: Atomically updated runtime settings, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeSettings' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /storage/status:
    get:
      operationId: getStorageRuntimeStatus
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Constant-time in-memory storage health for authenticated clients, content: { application/json: { schema: { $ref: '#/components/schemas/StorageRuntimeStatus' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /admin/storage:
    get:
      operationId: getStorageStatus
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Bounded storage health projection without internal paths, content: { application/json: { schema: { $ref: '#/components/schemas/StorageStatus' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/status:
    get:
      operationId: getAdminStatus
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Operational status without private content or raw job payloads, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStatus' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      operationId: listAdminUsers
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Bounded operational user metadata page; every stored user is reachable via cursor pagination, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAdminUser
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdminUserRequest' } } } }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/disable:
    post:
      operationId: disableAdminUser
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: User disabled and all sessions revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/password/reset:
    post:
      operationId: resetAdminUserPassword
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetAdminUserPasswordRequest' } } } }
      responses:
        '204': { description: Password reset and all sessions revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}:
    delete:
      operationId: deleteAdminUser
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: User-owned data deleted without deleting shared file objects }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/recipients:
    get:
      operationId: listRecipientUsers
      security: [{ cookieAuth: [] }]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200': { description: Active recipient directory ordered by recent activity, content: { application/json: { schema: { $ref: '#/components/schemas/RecipientUserList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-session }
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartNumber:
      name: partNumber
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x20-\x7E]+$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, minLength: 10, maxLength: 1024 }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string, maxLength: 100 }
    TOTPLoginChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, expiresAt]
      properties:
        challengeToken: { type: string, minLength: 32, maxLength: 128, description: Single-purpose, short-lived bearer capability; only valid together with a correct TOTP code }
        expiresAt: { type: string, format: date-time }
    TOTPChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string, minLength: 32, maxLength: 128 }
        code: { type: string, minLength: 6, maxLength: 8, pattern: '^[0-9]+$' }
    TOTPCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 8, pattern: '^[0-9]+$' }
    TOTPEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
    TOTPStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    TOTPEnrollmentPending:
      type: object
      additionalProperties: false
      required: [secret, otpauthUrl, digits, periodSeconds, algorithm]
      properties:
        secret: { type: string, minLength: 16, maxLength: 128, description: Base32 shared secret returned exactly once during enrollment }
        otpauthUrl: { type: string, maxLength: 512 }
        digits: { type: integer, enum: [6, 8] }
        periodSeconds: { type: integer, enum: [30] }
        algorithm: { type: string, enum: [SHA1] }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { type: string, minLength: 10, maxLength: 1024 }
    RenameDeviceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    User:
      type: object
      required: [id, username, displayName, isAdmin]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isAdmin: { type: boolean }
    Device:
      type: object
      required: [id, name, userAgent, firstSeenAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        userAgent: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    Session:
      type: object
      required: [id, deviceId, createdAt, lastSeenAt, expiresAt, absoluteExpiresAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        lastIp: { type: string }
        current: { type: boolean }
    AuthBootstrap:
      type: object
      required: [user, device, session, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }
        session: { $ref: '#/components/schemas/Session' }
        csrfToken: { type: string }
    BodyFormat:
      type: string
      enum: [TEXT, MARKDOWN]
    Lifecycle:
      type: string
      enum: [TEMPORARY, PERMANENT]
    UploadStatus:
      type: string
      enum: [CREATED, UPLOADING, COMPLETING, COMPLETED, FAILED, EXPIRED]
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [originalFilename, expectedSize]
      properties:
        originalFilename: { type: string, minLength: 1, maxLength: 255 }
        expectedSize: { type: integer, format: int64, minimum: 0 }
        clientMime: { type: [string, 'null'], maxLength: 255 }
    UploadSession:
      type: object
      additionalProperties: false
      required: [id, originalFilename, expectedSize, chunkSize, partCount, status, expiresAt, completedParts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        expectedSize: { type: integer, format: int64 }
        clientMime: { type: [string, 'null'] }
        chunkSize: { type: integer, format: int64 }
        partCount: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/UploadStatus' }
        expiresAt: { type: string, format: date-time }
        completedParts: { type: array, items: { type: integer, minimum: 0 }, uniqueItems: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMessageRequest:
      type: object
      additionalProperties: false
      properties:
        body: { type: [string, 'null'], minLength: 1, maxLength: 1048576 }
        bodyFormat: { $ref: '#/components/schemas/BodyFormat', default: TEXT }
        lifecycle: { $ref: '#/components/schemas/Lifecycle', default: TEMPORARY }
        sensitive: { type: boolean, default: false }
        tagIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true, default: [] }
        uploadIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true, default: [] }
    EditMessageRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        body: { type: [string, 'null'], minLength: 1, maxLength: 1048576 }
        bodyFormat: { $ref: '#/components/schemas/BodyFormat' }
        detectedType: { type: [string, 'null'], maxLength: 64 }
        detectedLanguage: { type: [string, 'null'], maxLength: 64 }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 } }
    ExtendMessageExpiryRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, days]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        days: { type: integer, enum: [1, 3, 7] }
    FavoriteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, favorite]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, favorite: { type: boolean } }
    SensitiveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, sensitive]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, sensitive: { type: boolean } }
    ReplaceMessageTagsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, tagIds]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, tagIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true } }
    EditSensitiveBodyRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, body]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, body: { type: string, minLength: 1, maxLength: 1048576 } }
    DirectSendRequest:
      type: object
      additionalProperties: false
      required: [recipientUserId]
      properties:
        recipientUserId: { type: string, format: uuid }
        body: { type: [string, 'null'], minLength: 1, maxLength: 1048576 }
        bodyFormat: { $ref: '#/components/schemas/BodyFormat', default: TEXT }
        sensitive: { type: boolean, default: false }
        uploadIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true, default: [] }
    AddAttachmentsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, uploadIds]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        uploadIds: { type: array, minItems: 1, items: { type: string, format: uuid }, uniqueItems: true }
    ForwardRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, recipientUserId]
      properties: { expectedVersion: { type: integer, format: int64, minimum: 1 }, recipientUserId: { type: string, format: uuid } }
    TagRequest:
      type: object
      additionalProperties: false
      required: [name, color]
      properties: { name: { type: string, minLength: 1, maxLength: 64 }, color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
    UpdateTagRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: { name: { type: string, minLength: 1, maxLength: 64 }, color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
    Tag:
      type: object
      required: [id, name, color, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, body, bodyFormat, sensitive, lifecycle, favorite, version, createdAt, updatedAt, tags, attachments]
      properties:
        id: { type: string, format: uuid }
        body: { type: [string, 'null'] }
        bodyFormat: { $ref: '#/components/schemas/BodyFormat' }
        detectedType: { type: [string, 'null'] }
        detectedLanguage: { type: [string, 'null'] }
        sensitive: { type: boolean }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        favorite: { type: boolean }
        expiresAt: { type: [string, 'null'], format: date-time }
        trashedAt: { type: [string, 'null'], format: date-time }
        purgeAt: { type: [string, 'null'], format: date-time }
        sourceUserId: { type: [string, 'null'], format: uuid }
        sourceMessageId: { type: [string, 'null'], format: uuid }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentSummary' } }
    AttachmentSummary:
      type: object
      additionalProperties: false
      required: [id, originalFilename, clientMime, detectedMime, sizeBytes, displayOrder]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        clientMime: { type: [string, 'null'] }
        detectedMime: { type: string }
        sizeBytes: { type: integer, format: int64 }
        displayOrder: { type: integer }
    MessageDeliveryReceipt:
      type: object
      additionalProperties: false
      required: [messageId, createdAt, expiresAt]
      properties:
        messageId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    MessageSummary:
      allOf:
        - { $ref: '#/components/schemas/Message' }
        - type: object
          required: [bodyPreview, bodyTruncated, attachmentCount]
          properties:
            bodyPreview: { type: [string, 'null'] }
            bodyTruncated: { type: boolean }
            attachmentCount: { type: integer, minimum: 0 }
    MessageList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }
        nextCursor: { type: [string, 'null'] }
    SensitiveBody:
      type: object
      required: [body, version]
      properties: { body: { type: string }, version: { type: integer, format: int64 } }
    Error:
      type: object
      required: [code, message, traceId, details]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details: {}
    RuntimeSettings:
      type: object
      additionalProperties: false
      required: [temporaryTtlHours, trashTtlHours, maxFileSizeBytes, maxStorageBytes, auditRetentionDays, uploadRetentionHours, updatedAt]
      properties:
        temporaryTtlHours: { type: integer, minimum: 1, maximum: 8760 }
        trashTtlHours: { type: integer, minimum: 1, maximum: 8760 }
        maxFileSizeBytes: { type: integer, format: int64, minimum: 1, maximum: 2199023255552 }
        maxStorageBytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        auditRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        uploadRetentionHours: { type: integer, minimum: 1, maximum: 168 }
        updatedAt: { type: string, format: date-time }
        updatedByUserId: { type: [string, 'null'], format: uuid }
    UpdateRuntimeSettingsRequest:
      type: object
      additionalProperties: false
      required: [temporaryTtlHours, trashTtlHours, maxFileSizeBytes, maxStorageBytes, auditRetentionDays, uploadRetentionHours]
      properties:
        temporaryTtlHours: { type: integer, minimum: 1, maximum: 8760 }
        trashTtlHours: { type: integer, minimum: 1, maximum: 8760 }
        maxFileSizeBytes: { type: integer, format: int64, minimum: 1, maximum: 2199023255552 }
        maxStorageBytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        auditRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        uploadRetentionHours: { type: integer, minimum: 1, maximum: 168 }
    HealthState:
      type: string
      enum: [HEALTHY, DEGRADED, UNAVAILABLE]
    StorageThresholdState:
      type: string
      enum: [UNCONFIGURED, NORMAL, WARNING, STRONG_WARNING, LIMIT_REACHED]
    StorageRuntimeStatus:
      type: object
      additionalProperties: false
      required: [healthy, reason, lastCheckedAt, changedAt]
      properties:
        healthy: { type: boolean }
        reason: { type: string, enum: [HEALTHY, NAS_UNAVAILABLE, NAS_TIMEOUT, NAS_FULL] }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        changedAt: { type: string, format: date-time }
    StorageStatus:
      type: object
      additionalProperties: false
      required: [state, logicalUsageBytes, maxStorageBytes, thresholdState, nasAvailableBytes, nasTotalBytes, stagingUsageBytes, stagingAvailableBytes, stagingTotalBytes, degradedReasons]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        logicalUsageBytes: { type: integer, format: int64, minimum: 0 }
        maxStorageBytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        thresholdState: { $ref: '#/components/schemas/StorageThresholdState' }
        nasAvailableBytes: { type: [integer, 'null'], format: int64, minimum: 0 }
        nasTotalBytes: { type: [integer, 'null'], format: int64, minimum: 0 }
        stagingUsageBytes: { type: integer, format: int64, minimum: 0 }
        stagingAvailableBytes: { type: [integer, 'null'], format: int64, minimum: 0 }
        stagingTotalBytes: { type: [integer, 'null'], format: int64, minimum: 0 }
        degradedReasons: { type: array, items: { type: string, enum: [NAS_UNAVAILABLE, NAS_TIMEOUT, NAS_FULL, LOGICAL_THRESHOLD_WARNING, LOGICAL_THRESHOLD_EXCEEDED, STAGING_UNAVAILABLE, DATABASE_UNAVAILABLE] }, uniqueItems: true }
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, gitCommit, buildTime]
      properties:
        version: { type: string }
        gitCommit: { type: string }
        buildTime: { type: string }
    MigrationStatus:
      type: object
      additionalProperties: false
      required: [currentVersion, latestVersion, compatible]
      properties:
        currentVersion: { type: integer, format: int64, minimum: 0 }
        latestVersion: { type: integer, format: int64, minimum: 1 }
        compatible: { type: boolean }
    FailedJob:
      type: object
      additionalProperties: false
      required: [id, type, subjectType, attempts, errorCode, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        subjectType: { type: string }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string }
        updatedAt: { type: string, format: date-time }
    AdminStatus:
      type: object
      additionalProperties: false
      required: [state, build, migration, databaseState, failedJobs, storage, security]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        build: { $ref: '#/components/schemas/BuildInfo' }
        migration: { $ref: '#/components/schemas/MigrationStatus' }
        databaseState: { $ref: '#/components/schemas/HealthState' }
        failedJobs: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/FailedJob' } }
        storage: { $ref: '#/components/schemas/StorageStatus' }
        security: { $ref: '#/components/schemas/AdminSecurityStatus' }
    AdminSecurityStatus:
      type: object
      additionalProperties: false
      required: [activeAdmins, activeAdminsWithoutTOTP, adminTotpSatisfied]
      properties:
        activeAdmins: { type: integer, minimum: 0 }
        activeAdminsWithoutTOTP: { type: integer, minimum: 0 }
        adminTotpSatisfied: { type: boolean, description: True when at least one active admin exists and every active admin has confirmed TOTP }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, isAdmin, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isAdmin: { type: boolean }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUserList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        nextCursor: { type: [string, 'null'] }
    RecipientUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
    RecipientUserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/RecipientUser' } }
    CreateAdminUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password, isAdmin]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
